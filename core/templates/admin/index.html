{% extends "admin/base_site.html" %}
{% load static %}

{% block content %}

<h2>📊 Dashboard</h2>

<div class="row">

    <div class="col-md-4">
        <div class="card p-3">
            <h4>💰 Revenue</h4>
            <h2>₹ {{ total_revenue }}</h2>
        </div>
    </div>

    <div class="col-md-4">
        <div class="card p-3">
            <h4>🛒 Orders</h4>
            <h2>{{ total_orders }}</h2>
        </div>
    </div>

    <div class="col-md-4">
        <div class="card p-3">
            <h4>👤 Users</h4>
            <h2>{{ total_users }}</h2>
        </div>
    </div>

</div>

<br>

<canvas id="chart"></canvas>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
    new Chart(document.getElementById('chart'), {
        type: 'bar',
        data: {
            labels: {{ months|safe }},
            datasets: [{
                label: 'Revenue',
                data: {{ revenue_data|safe }},
            }]
        }
    });
</script>

{% endblock %}
