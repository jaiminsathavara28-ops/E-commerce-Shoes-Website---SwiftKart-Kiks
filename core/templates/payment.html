{% extends "base.html" %}
{% load static %}
{% block title %} Payment {% endblock %}
{% block content %}

<form id="paymentForm" method="POST">
    {% csrf_token %}
    <h4>Payment Information:</h4>
    <!-- Payment Section Start -->
    <div class="container my-5">
        <div class="row justify-content-center">
            <div class="col-lg-10 col-md-8 col-12">

                <div class="card shadow-lg border-0 rounded-4">
                    <div class="card-body p-4">

                        <h4 class="mb-4 text-center fw-bold">Select Payment Method</h4>


                        <!-- Cash on Delivery -->
                        <div class="form-check payment-option mb-3 p-3 rounded">
                            <input class="form-check-input" type="radio"
                                   name="payment_method"
                                   value="COD"
                                   id="cod" checked>
                            <label class="form-check-label w-100" for="cod">
                                💵 Cash on Delivery
                            </label>
                        </div>

                        <!-- Razorpay -->
                        <div class="form-check payment-option mb-3 p-3 rounded">
                            <input class="form-check-input" type="radio"
                                   name="payment_method"
                                   value="razorpay"
                                   id="razorpay">
                            <label class="form-check-label w-100" for="razorpay">
                                💳 Credit / Debit Card (Razorpay)
                            </label>
                        </div>

                        <!-- UPI -->
                        <div class="form-check payment-option mb-3 p-3 rounded">
                            <input class="form-check-input" type="radio"
                                   name="payment_method"
                                   value="UPI"
                                   id="upi">
                            <label class="form-check-label w-100" for="upi">
                                📱 UPI Payment
                            </label>
                        </div>
                        <div class="d-flex align-items-center mt-2">
                            <input type="checkbox" id="checkbox" name="checkbox">
                            <label class="mb-0" for="checkbox">I accept <a
                                    href="#">Terms</a> and <a href="#">conditions</a>
                                and general policy</label>
                        </div>
                        <button type="button" id="pay-btn" class="btn btn-dark w-100 mt-3 rounded-3">
                            Continue Payment

                        </button>


                    </div>
                </div>

            </div>
        </div>
    </div>

    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>

    <script>
        document.addEventListener("DOMContentLoaded", function () {

            const payBtn = document.getElementById("pay-btn");
            const paymentForm = document.getElementById("paymentForm");

            payBtn.addEventListener("click", function () {

                const selectedMethod = document.querySelector('input[name="payment_method"]:checked');
                const termsChecked = document.getElementById("checkbox").checked;

                if (!termsChecked) {
                    alert("Please accept Terms & Conditions");
                    return;
                }

                if (!selectedMethod) {
                    alert("Please select a payment method");
                    return;
                }

                const paymentMethod = selectedMethod.value;

                // ✅ CASH ON DELIVERY
                if (paymentMethod === "COD") {
                    paymentForm.submit();
                    return;
                }

                // ✅ RAZORPAY
                if (paymentMethod === "razorpay") {

                    var options = {
                        "key": "{{ razorpay_key }}",
                        "amount": "{{ amount }}",
                        "currency": "INR",
                        "order_id": "{{ order_id }}",

                         handler: function (response) {

        // Create hidden form
        var form = document.createElement("form");
        form.method = "POST";
        form.action = "/payment-success/";

        var csrf = document.createElement("input");
        csrf.type = "hidden";
        csrf.name = "csrfmiddlewaretoken";
        csrf.value = "{{ csrf_token }}";
        form.appendChild(csrf);

        var orderId = document.createElement("input");
        orderId.type = "hidden";
        orderId.name = "razorpay_order_id";
        orderId.value = response.razorpay_order_id;
        form.appendChild(orderId);

        var paymentId = document.createElement("input");
        paymentId.type = "hidden";
        paymentId.name = "razorpay_payment_id";
        paymentId.value = response.razorpay_payment_id;
        form.appendChild(paymentId);

        document.body.appendChild(form);
        form.submit();
    },

                        "prefill": {
                            "name": "{{ request.user.username }}",
                            "email": "{{ request.user.email|default:"Not Provided" }}",
                            "contact": "91{{ request.user.profile.phone }}"

                        },

                        "theme": {
                            "color": "#000000"
                        }
                    };

                    var rzp = new Razorpay(options);
                    rzp.open();
                    return;
                }

                // ✅ UPI (optional)
                if (paymentMethod === "UPI") {
                    alert("UPI integration coming soon");
                    return;
                }

            });

        });
    </script>
    <!-- Payment Section End -->

</form>
{% endblock %}
